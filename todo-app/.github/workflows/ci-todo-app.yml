name: CI / TODO Web App

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  # ========== 平台配置 ==========
  PLATFORM: github-actions
  RUNNER: ubuntu-latest

  # ========== 版本配置 ==========
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

  # ========== 安全工具版本 ==========
  TRIVY_VERSION: '0.49.1'
  GITLEAKS_VERSION: '8.18.2'
  SEMGREP_VERSION: '1.71.0'

  # ========== 项目路径 ==========
  FRONTEND_DIR: todo-app
  BACKEND_DIR: todo-app

  # ========== 后端配置 ==========
  # 注意: HMAC_SECRET 通过 GitHub Secret 注入，dev 环境需在 repo Settings -> Secrets 设置
  BACKEND_HMAC_SECRET: ${{ secrets.HMAC_SECRET }}

jobs:
  # ============================================================
  # STAGE 0: 环境准备 + 依赖安装
  # ============================================================
  env:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Node.js 环境 (前端) ---
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      # --- Python 环境 (后端) ---
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/requirements.txt'

      # --- 安装前端依赖 ---
      - name: Install frontend dependencies
        if: contains(github.event_path, '${{ env.FRONTEND_DIR }}') || github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci || true

      # --- 安装后端依赖 ---
      - name: Install backend dependencies
        if: contains(github.event_path, '${{ env.BACKEND_DIR }}') || github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install --break-system-packages -r requirements.txt
          pip install --break-system-packages -r requirements-dev.txt 2>/dev/null || true
          pip install --break-system-packages pytest pytest-cov httpx pytest-asyncio

  # ============================================================
  # STAGE 1: L1 依赖扫描
  # ============================================================
  stage-1-dependency-scan:
    needs: env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- npm audit (前端) ---
      - name: Run npm audit (frontend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm audit --audit-level=high || true

      # --- pip-audit (后端) ---
      - name: Run pip-audit (backend)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install --break-system-packages pip-audit 2>/dev/null || true
          pip-audit --format=json --output=pip-audit.json 2>/dev/null || true

      # --- Trivy 文件系统扫描 ---
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'

  # ============================================================
  # STAGE 2: L2 密钥扫描
  # ============================================================
  stage-2-secret-scan:
    needs: env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Gitleaks ---
      - name: Run Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz" | tar -xz
          ./gitleaks detect \
            --source . \
            --verbose \
            --exit-code 1 \
            --log-level info \
            --format json \
            --report-path gitleaks-report.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  # ============================================================
  # STAGE 3: L3 SAST (Semgrep)
  # ============================================================
  stage-3-sast:
    needs: env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Semgrep 前端 (Node.js/React) ---
      - name: Run Semgrep (frontend)
        uses: returntocorp/semgrep-action@1.171.0
        with:
          config: |
            p/owasp-top-ten
            p/nodejs
            p/typescript
          scan-uncommitted-branches: false

      # --- Semgrep 后端 (Python/FastAPI) ---
      - name: Run Semgrep (backend)
        uses: returntocorp/semgrep-action@1.171.0
        with:
          config: |
            p/owasp-top-ten
            p/python
            p/docker
          scan-uncommitted-branches: false

  # ============================================================
  # STAGE 4: 前端测试 (React + TypeScript)
  # ============================================================
  frontend-test:
    needs: env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # --- ESLint 检查 ---
      - name: Run ESLint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx eslint . --max-warnings=0 || true

      # --- TypeScript 类型检查 ---
      - name: Run TypeScript check
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx tsc --noEmit || true

      # --- 单元测试 ---
      - name: Run frontend tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm test -- --coverage --maxWorkers=2 || true

      # --- 上传覆盖率报告 ---
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage/
          retention-days: 7

  # ============================================================
  # STAGE 5: 后端测试 (Python + FastAPI)
  # ============================================================
  backend-test:
    needs: env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/requirements.txt'

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install --break-system-packages -r api/requirements.txt
          pip install --break-system-packages pytest pytest-cov httpx pytest-asyncio

      # --- Python Lint (flake8) ---
      - name: Run flake8
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install --break-system-packages flake8 black isort 2>/dev/null || true
          flake8 api --max-line-length=120 --extend-ignore=E203,W503 || true

      # --- Pytest 测试 ---
      - name: Run pytest
        working-directory: ${{ env.BACKEND_DIR }}
        run: pytest --cov=api --cov-report=xml --cov-report=term || true

      # --- 上传覆盖率报告 ---
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ${{ env.BACKEND_DIR }}/coverage.xml
          retention-days: 7

  # ============================================================
  # STAGE 6: FastAPI 健康检查
  # ============================================================
  backend-health-check:
    needs: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FastAPI & Uvicorn
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install --break-system-packages fastapi uvicorn httpx

      - name: Start FastAPI in background
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # HMAC_SECRET: dev-secret for local dev, set via GitHub Secret for CI
          export HMAC_SECRET="${BACKEND_HMAC_SECRET:-dev-secret}"
          uvicorn api.index:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Verify health endpoint response
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -c "
            import httpx
            import time
            time.sleep(3)
            try:
                resp = httpx.get('http://localhost:8000/health', timeout=10)
                print(f'Status: {resp.status_code}')
                print(f'Response: {resp.text}')
                assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
                print('✅ Health check passed')
            except httpx.ConnectError as e:
                print(f'❌ Connection failed: {e}')
                exit(1)
            except Exception as e:
                print(f'❌ Health check error: {e}')
                exit(1)
          "

  # ============================================================
  # STAGE 7: 后端构建
  # ============================================================
  backend-build:
    needs: [backend-test, backend-health-check, security-gate]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/api/requirements.txt'

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install --break-system-packages -r api/requirements.txt

      - name: Run pytest (final validation)
        working-directory: ${{ env.BACKEND_DIR }}
        run: pytest -v || true

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: |
            ${{ env.BACKEND_DIR }}/api/
            ${{ env.BACKEND_DIR }}/api/requirements.txt
          retention-days: 5

  # ============================================================
  # STAGE 8: 前端构建
  # ============================================================
  frontend-build:
    needs: [frontend-test, security-gate]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 5

  # ============================================================
  # STAGE 9: 安全门禁汇总
  # ============================================================
  security-gate:
    needs: [stage-1-dependency-scan, stage-2-secret-scan, stage-3-sast]
    runs-on: ubuntu-latest

    steps:
      - name: Security Gate Summary
        run: |
          echo "## 🔒 Security Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| L1 Dependency Scan | ${{ needs.stage-1-dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L2 Secret Scan | ${{ needs.stage-2-secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L3 SAST | ${{ needs.stage-3-sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.stage-1-dependency-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.stage-2-secret-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.stage-3-sast.result }}" == "failure" ]]; then
            echo "❌ Security gates failed. Review reports above."
            exit 1
          else
            echo "✅ All security gates passed."
          fi

  # ============================================================
  # CI 汇总报告
  # ============================================================
  ci-summary:
    needs: [frontend-test, backend-test, backend-health-check, security-gate]
    runs-on: ubuntu-latest

    steps:
      - name: CI Summary
        run: |
          echo "## 📋 CI Summary - TODO Web App" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Test | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Test | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Health Check | ${{ needs.backend-health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Gate | ${{ needs.security-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 技术栈" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: React + TypeScript (Node ${{ env.NODE_VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: Python + FastAPI (Python ${{ env.PYTHON_VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: SQLite (dev) / PostgreSQL (prod)" >> $GITHUB_STEP_SUMMARY
